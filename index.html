<body>

<div class="sec w"><b>☁️ 小小缺点</b><span id="r3"></span></div>
<div class="alt" id="ra"></div>
<button class="btn ghost" id="again">重新测试</button>
<div class="foot">截图保存，发给也在纠结去哪生活的朋友吧 ✿</div>
</div>
</div>
